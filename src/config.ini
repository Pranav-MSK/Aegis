# ==========================
# Application Metadata
# ==========================
[app.meta]
NAME = SystemGuard
VERSION = 1.0.2
DESCRIPTION = A web application to monitor and manage system resources.
AUTHOR = SystemGuard Team
YEAR = 2023
CONTACT_EMAIL = ""
PRE_RELEASE = False

# ==========================
# Application Settings
# ==========================
[app.settings]
UNDER_MAINTENANCE = False


# ==========================
# Database Configuration
# ==========================
[database]
POOL_SIZE = 10
MAX_OVERFLOW = 5

# ==========================
# Session Configuration
# ==========================
[session]
COOKIE_HTTPONLY = True
COOKIE_SAMESITE = Lax
COOKIE_SECURE = False

# ==========================
# Prometheus Integration
# ==========================
[monitoring.prometheus]
BASE_URL = http://localhost:9090
QUERY_API = http://localhost:9090/api/v1/query
TARGETS_API = http://localhost:9090/api/v1/targets

# ==========================
# Logging
# ==========================
[logging]
LEVEL = INFO

# ==========================
# System Metrics Service
# ==========================
[metrics.settings]
BYTES_PER_GB = 1073741824
BYTES_PER_MB = 1048576
BYTES_PER_KB = 1024
UPDATE_INTERVAL = 1.0
CACHE_EXPIRATION = 3600
DIVIDE_BY_1024 = False

# ==========================
# Testing webserver
# ==========================
[webserver.test]
HOST = "0.0.0.0"
PORT = 5001
DEBUG = True

# ==========================
# Production webserver
# ==========================
[webserver.production]
HOST = "0.0.0.0"
PORT = 5050
DEBUG = False

# ==========================
