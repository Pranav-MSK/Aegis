{% extends 'base/base.html' %}
{% block title %}Histogram Metrics{% endblock %}
{% block extra_head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/summary_metrics.css') }}">
{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1 class="card-title">Metrics Dashboard</h1>

        <div class="select-container">
            <label for="metricSelect">Select Metric</label>
            <select id="metricSelect">
                <option value="">Choose a metric</option>
            </select>

            <label for="endpointSelect">Select Endpoint (Optional)</label>
            <select id="endpointSelect">
                <option value="">All endpoints</option>
            </select>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Loading...</div>

        <div id="dashboard" style="display: none;">
            <div class="grid">
                <div class="card">
                    <h2 class="card-title">Total Requests</h2>
                    <div id="totalRequests"></div>
                </div>

                <!-- <div class="card">
                        <h2 class="card-title">Average</h2>
                        <div id="averageTime"></div>
                    </div>
                     -->
                <!-- <div class="card">
                        <h2 class="card-title">Percentiles (24h)</h2>
                        <div id="percentiles"></div>
                    </div> -->
            </div>

            <div class="card">
                <h2 class="card-title">Request Rate</h2>
                <div class="chart-container">
                    <canvas id="rateChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let rateChart = null;

    // Fetch available metrics
    async function fetchMetrics() {
        try {
            const response = await fetch('/api/v1/metrics/available');
            const data = await response.json();

            if (data.status === 'success') {
                const metricSelect = document.getElementById('metricSelect');
                metricSelect.innerHTML = '<option value="">Choose a metric</option>';

                Object.keys(data.data).forEach(metric => {
                    const option = document.createElement('option');
                    option.value = metric;
                    option.textContent = metric;
                    metricSelect.appendChild(option);
                });
            }
        } catch (error) {
            showError(`Failed to load metrics, error: ${error.message}`);
        }
    }

    // Fetch endpoints for selected metric
    async function updateEndpoints(metric) {
        try {
            const response = await fetch('/api/v1/metrics/available');
            const data = await response.json();

            const endpointSelect = document.getElementById('endpointSelect');
            endpointSelect.innerHTML = '<option value="">All endpoints</option>';

            if (data.status === 'success' && data.data[metric]) {
                data.data[metric].forEach(endpoint => {
                    const option = document.createElement('option');
                    option.value = endpoint;
                    option.textContent = endpoint || '(root)';
                    endpointSelect.appendChild(option);
                });
            }
        } catch (error) {
            showError('Failed to load endpoints');
        }
    }

    // Fetch and display metric summary
    async function fetchSummary(metric, endpoint) {
        showLoading(true);
        try {
            const params = new URLSearchParams({ metric });
            if (endpoint) params.append('endpoint', endpoint);

            const response = await fetch(`/api/v1/metrics/summary?${params}`);
            const data = await response.json();

            if (data.status === 'success') {
                updateDashboard(data.data);
            } else {
                showError(data.message || 'Failed to load metrics data');
            }
        } catch (error) {
            showError('Failed to load metrics data');
        }
        showLoading(false);
    }

    // Update dashboard with new data
    function updateDashboard(data) {
        document.getElementById('dashboard').style.display = 'block';

        // Update total requests
        const totalRequestsEl = document.getElementById('totalRequests');

        let displayKey;
        let dataKey;
        let label3;
        let label4;

        if (data.count.length > 0) {
            if (data.count[0].endpoint) {
                displayKey = 'Endpoint';
                dataKey = 'endpoint';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].query_type) {
                displayKey = 'Query Type';
                dataKey = 'query_type';
                label3 = 'Total Queries';
                label4 = 'Average Query Time';
            } else if (data.count[0].method) {
                displayKey = 'Method';
                dataKey = 'method';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].status) {
                displayKey = 'Status';
                dataKey = 'status';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].status_code) {
                displayKey = 'Status Code';
                dataKey = 'status_code';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].reason) {
                displayKey = 'Reason';
                dataKey = 'reason';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].error) {
                displayKey = 'Error';
                dataKey = 'error';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].error_code) {
                displayKey = 'Error Code';
                dataKey = 'error_code';
                label3 = 'Total Requests';
                label4 = 'Average';
            } else if (data.count[0].payment_method) {
                displayKey = 'Payment Method';
                dataKey = 'payment_method';
                label3 = 'Total Amount';
                label4 = 'Average Amount';
            } else if (data.count[0].user_id) {
                displayKey = 'User ID';
                dataKey = 'user_id';
                label3 = 'Total Duration';
                label4 = 'Average Duration';
            }
        } else {
            displayKey = 'Endpoint';
            dataKey = 'endpoint';
        }

        totalRequestsEl.innerHTML = createMetricTable(data, 'Instance', displayKey, label3, label4, dataKey);

        // Update chart
        updateRateChart(data);
    }

    // Create metric table HTML
    function createMetricTable(data, label1, displayKey, label3, label4, dataKey) {
        return `
                <table class="metric-table">
                    <thead>
                        <tr>
                            <th>${label1}</th>
                            <th>${displayKey || 'All'}</th>
                            <th>${label3}</th>
                            <th>${label4}</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.count.map((item, index) => `
                            <tr>
                                <td>${item.instance || 'Unknown'}</td>
                                <td>${item[dataKey] || 'All'}</td>
                                <td>${formatNumber(item.value)}</td>
                                <td>${formatNumber(data.averages[index]?.value)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
    }

    // Update rate chart
    function updateRateChart(data) {
        const ctx = document.getElementById('rateChart').getContext('2d');

        if (rateChart) {
            rateChart.destroy();
        }

        const chartData = data.last_hour.map(item => ({
            endpoint: item.endpoint,
            hourly: item.value,
            daily: data.last_day.find(d => d.endpoint === item.endpoint)?.value
        }));

        rateChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: chartData.map(d => d.endpoint),
                datasets: [
                    {
                        label: 'Requests per Hour',
                        data: chartData.map(d => d.hourly),
                        backgroundColor: 'rgba(37, 99, 235, 0.5)',
                        borderColor: 'rgba(37, 99, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Requests per Day',
                        data: chartData.map(d => d.daily),
                        backgroundColor: 'rgba(34, 197, 94, 0.5)',
                        borderColor: 'rgba(34, 197, 94, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Utility functions
    function formatNumber(value) {
        if (value === undefined || value === null) return 'N/A';
        return typeof value === 'number' ? value.toFixed(2) : value;
    }

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
        document.getElementById('dashboard').style.display = show ? 'none' : 'block';
    }

    function showError(message) {
        const errorEl = document.getElementById('error');
        errorEl.textContent = message;
        errorEl.style.display = message ? 'block' : 'none';

        if (message) {
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 2000);
        }
    }

    // Event listeners
    document.getElementById('metricSelect').addEventListener('change', (e) => {
        const metric = e.target.value;
        if (metric) {
            updateEndpoints(metric);
            fetchSummary(metric, document.getElementById('endpointSelect').value);
        }
    });

    document.getElementById('endpointSelect').addEventListener('change', (e) => {
        const metric = document.getElementById('metricSelect').value;
        if (metric) {
            fetchSummary(metric, e.target.value);
        }
    });

    // Initialize
    fetchMetrics();
</script>
{% endblock %}
