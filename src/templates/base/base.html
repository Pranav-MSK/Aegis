<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Dashboard{% endblock %}</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/shield-emoji.png">
    <link rel="icon" type="image/png" sizes="96x96" href="https://img.icons8.com/emoji/96/shield-emoji.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">

    {% block extra_head %}{% endblock %}
</head>

<body>
    {% include 'ext/navbar.html' %}

    <!-- Sidebar -->
    <div class="sidebar">
        <br><br><br><br>
        <div class="sidebar-header">
            <h2>System Features</h2>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="metrics">
                <i class="fas fa-tachometer-alt"></i>
                <a href="{{ url_for('dashboard') }}" class="feature-link" style="text-decoration: none;">Dashboard</a>
            </div>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="metrics">
                <i class="fas fa-chart-line"></i>
                <a href="{{ url_for('historical_system_metrics') }}" class="feature-link" style="text-decoration: none;">System Metrics</a>
            </div>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="security">
                <i class="fas fa-shield-alt"></i>
                <a href="{{ url_for('security_analysis') }}" class="feature-link" style="text-decoration: none;">Security Analysis</a>
            </div>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="alerts">
                <i class="fas fa-bell"></i>
                <a href="{{ url_for('alert_history') }}" class="feature-link" style="text-decoration: none;">Alert Tracker</a>
            </div>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="settings">
                <i class="fas fa-cogs"></i>
                <a href="{{ url_for('settings') }}" class="feature-link" style="text-decoration: none;">Control Panel</a>
            </div>
        </div>
        <div class="feature-list">
            <div class="feature-item" data-section="users">
                <i class="fas fa-users"></i>
                <a href="{{ url_for('view_users') }}" class="feature-link" style="text-decoration: none;">User Management</a>
            </div>
        </div>
    </div>
    
    <!-- Overlay -->
    <div class="sidebar-overlay"></div>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>

    <!-- Popper.js and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>

    <!-- Custom Scripts -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_scripts %}{% endblock %}

    {% include 'ext/footer.html' %}
</body>

</html>
