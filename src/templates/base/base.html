<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Dashboard{% endblock %}</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/shield-emoji.png">
    <link rel="icon" type="image/png" sizes="96x96" href="https://img.icons8.com/emoji/96/shield-emoji.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-gray-100">
    {% include 'ext/loader.html' %}
    <div class="min-h-screen flex">
        {% include 'ext/sidebar.html' %}
        <!--- Main Content --->
        <div class="flex-1 flex flex-col min-h-screen lg:pl-64">
            <!-- Mobile Header -->
            <div class="lg:hidden flex items-center p-4 bg-white border-b">
                <button type="button" class="p-2 rounded-md text-gray-500 hover:text-gray-600 hover:bg-gray-100"
                    onclick="toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h1 class="ml-4 text-xl font-semibold text-gray-900">{% block page_title %}Dashboard{% endblock %}</h1>
            </div>

            <!-- Main Content Area -->
            <main class="flex-1 p-6">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            {% include 'ext/footer.html' %}
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (window.innerWidth < 1024 &&
                !sidebar.contains(event.target) &&
                !event.target.closest('button')) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>

    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/spinner.js') }}"></script>

    {% block extra_scripts %}{% endblock %}


</body>

</html>
